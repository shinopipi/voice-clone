<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>マイボイス — 音声生成</title>
<style>
  :root {
    --bg: #14161c; --card: #1e212b; --line: #2f3442; --text: #eceef4; --sub: #9aa1b4;
    --accent: #ff7a59; --accent2: #ffb199; --ok: #5fd39a; --err: #ff6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.6;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  main { max-width: 560px; margin: 0 auto; }
  header { padding: 28px 0 8px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--sub); font-size: 13px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
  h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  h2 i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #14161c;
         font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 4px; }
  input[type=password], textarea, select {
    width: 100%; background: #14161c; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px 16px; min-height: 48px;
    background: var(--accent); color: #14161c; width: 100%; margin-top: 14px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .pick { display: flex; gap: 8px; align-items: stretch; }
  .pick select { flex: 1; }
  .pick button { width: auto; margin: 0; padding: 0 14px; flex: none; }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .desc { font-size: 12px; color: var(--sub); margin-top: 6px; min-height: 1.4em; }
  audio { width: 100%; margin-top: 12px; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 1.4em; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .range { display: flex; align-items: center; gap: 10px; }
  .range input { flex: 1; accent-color: var(--accent); }
  .range output { width: 2.5em; text-align: right; font-size: 13px; color: var(--sub); }
  .count { text-align: right; font-size: 12px; color: var(--sub); }
  .hist { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .hist:first-child { border-top: 0; }
  .hist span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist button { width: auto; min-height: 36px; padding: 4px 12px; margin: 0; font-size: 13px; }
  a { color: var(--accent2); }
</style>
</head>
<body>
<main>
  <header>
    <h1>マイ<span>ボイス</span></h1>
    <p>文章を入力して、好きな声で読み上げます（ElevenLabs API 使用）</p>
  </header>

  <section>
    <h2><i>1</i>APIキー</h2>
    <input type="password" id="apiKey" placeholder="sk_..." autocomplete="off">
    <p class="note">キーはこの端末のブラウザ内だけに保存され、ElevenLabs 以外には送信されません。
      <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank" rel="noopener">キーの取得はこちら</a></p>
    <button id="saveKey">保存して声の一覧を読み込む</button>
    <div class="msg" id="keyMsg"></div>
  </section>

  <section>
    <h2><i>2</i>音声を生成する</h2>
    <label for="voiceSel">声</label>
    <div class="pick">
      <select id="voiceSel"><option value="">（APIキーを保存すると表示されます）</option></select>
      <button class="ghost" id="previewBtn" title="試聴">▶ 試聴</button>
    </div>
    <div class="desc" id="voiceDesc"></div>

    <label for="modelSel">モデル</label>
    <select id="modelSel">
      <option value="eleven_multilingual_v2">Multilingual v2（安定・標準）</option>
      <option value="eleven_v3">Eleven v3（表現力が高い）</option>
      <option value="eleven_flash_v2_5">Flash v2.5（速い・安い）</option>
    </select>

    <label for="text">読み上げる文章</label>
    <textarea id="text" placeholder="ここに文章を入力"></textarea>
    <div class="count"><span id="charCount">0</span> 文字</div>

    <div id="settings">
      <label>安定性（低いほど感情豊か）</label>
      <div class="range"><input type="range" id="stab" min="0" max="1" step="0.05" value="0.5"><output id="stabOut">0.50</output></div>
      <label>声の再現度</label>
      <div class="range"><input type="range" id="sim" min="0" max="1" step="0.05" value="0.75"><output id="simOut">0.75</output></div>
      <label>話す速さ</label>
      <div class="range"><input type="range" id="speed" min="0.7" max="1.2" step="0.05" value="1"><output id="speedOut">1.00</output></div>
    </div>

    <button id="genBtn">音声を生成</button>
    <div class="msg" id="genMsg"></div>
    <audio id="outPlayer" controls hidden></audio>
    <div class="row" id="outActions" hidden>
      <button class="ghost" id="dlBtn">MP3を保存</button>
      <button class="ghost" id="shareBtn">共有</button>
    </div>
  </section>

  <section>
    <h2><i>3</i>今回作った音声</h2>
    <div id="history"><p class="note" style="margin:0">まだありません（ページを閉じると消えます）。</p></div>
  </section>
</main>

<audio id="previewPlayer" hidden></audio>

<script>
(() => {
  const API = 'https://api.elevenlabs.io';
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  let voices = [];
  let current = null;   // { blob, name }
  const history = [];

  const msg = (el, text, kind) => { el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); };
  const key = () => $('apiKey').value.trim();

  async function api(path, opts = {}) {
    if (!key()) throw new Error('APIキーを入力してください。');
    const res = await fetch(API + path, { ...opts, headers: { 'xi-api-key': key(), ...(opts.headers || {}) } });
    if (!res.ok) {
      let detail = '';
      try {
        const j = await res.json();
        const d = j.detail;
        detail = typeof d === 'string' ? d : (d && (d.message || d.status)) || JSON.stringify(j);
      } catch {}
      if (res.status === 401) detail = 'APIキーが正しくないか、権限が不足しています。' + (detail ? '（' + detail + '）' : '');
      if (/quota|credits/i.test(detail)) detail = '今月のクレジットが足りません。文章を短くするか、来月まで待ってください。（' + detail + '）';
      throw new Error(detail || ('エラー ' + res.status));
    }
    return res;
  }

  // ---------- voices ----------
  const GENDER = { male: '男性', female: '女性', neutral: '中性' };
  const AGE = { young: '若い', middle_aged: '中年', 'middle aged': '中年', old: '年配' };
  function describe(v) {
    const l = v.labels || {};
    return [GENDER[l.gender] || l.gender, AGE[l.age] || l.age, l.accent, l.descriptive || l.description, l.use_case || l['use case']]
      .filter(Boolean).join(' / ');
  }

  async function loadVoices() {
    const res = await api('/v1/voices');
    ({ voices = [] } = await res.json());
    const sel = $('voiceSel');
    const last = store.get('mv_voice');
    sel.innerHTML = '';
    const groups = [['女性', v => (v.labels || {}).gender === 'female'], ['男性', v => (v.labels || {}).gender === 'male'], ['その他', v => !['female', 'male'].includes((v.labels || {}).gender)]];
    groups.forEach(([label, test]) => {
      const list = voices.filter(test);
      if (!list.length) return;
      const g = document.createElement('optgroup'); g.label = label;
      list.forEach(v => { const o = document.createElement('option'); o.value = v.voice_id; o.textContent = v.name; g.appendChild(o); });
      sel.appendChild(g);
    });
    if (!voices.length) sel.innerHTML = '<option value="">声がありません</option>';
    if (last && voices.some(v => v.voice_id === last)) sel.value = last;
    showDesc();
    return voices.length;
  }
  function selectedVoice() { return voices.find(v => v.voice_id === $('voiceSel').value); }
  function showDesc() { const v = selectedVoice(); $('voiceDesc').textContent = v ? describe(v) : ''; }

  $('voiceSel').onchange = () => { store.set('mv_voice', $('voiceSel').value); showDesc(); stopPreview(); };

  const pp = $('previewPlayer');
  function stopPreview() { pp.pause(); $('previewBtn').textContent = '▶ 試聴'; }
  pp.onended = stopPreview;
  $('previewBtn').onclick = () => {
    const v = selectedVoice();
    if (!v || !v.preview_url) { $('voiceDesc').textContent = 'この声には試聴音声がありません。'; return; }
    if (!pp.paused) { stopPreview(); return; }
    pp.src = v.preview_url;
    pp.play().then(() => { $('previewBtn').textContent = '■ 停止'; }).catch(() => {});
  };

  $('saveKey').onclick = async () => {
    store.set('mv_key', key());
    msg($('keyMsg'), '読み込み中…');
    try { const n = await loadVoices(); msg($('keyMsg'), '保存しました。使える声: ' + n + ' 種類', 'ok'); }
    catch (e) { msg($('keyMsg'), e.message, 'err'); }
  };

  // ---------- generate ----------
  const bindRange = (id, out) => { $(id).oninput = () => { $(out).textContent = Number($(id).value).toFixed(2); }; };
  bindRange('stab', 'stabOut'); bindRange('sim', 'simOut'); bindRange('speed', 'speedOut');
  $('text').value = store.get('mv_text');
  const updCount = () => { $('charCount').textContent = $('text').value.length; };
  $('text').oninput = () => { updCount(); store.set('mv_text', $('text').value); };
  updCount();
  const savedModel = store.get('mv_model');
  if (savedModel) $('modelSel').value = savedModel;
  const updModel = () => { $('settings').hidden = $('modelSel').value === 'eleven_v3'; store.set('mv_model', $('modelSel').value); };
  $('modelSel').onchange = updModel; updModel();

  function stamp() {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
  }
  const toFile = item => new File([item.blob], item.name, { type: 'audio/mpeg' });

  $('genBtn').onclick = async () => {
    const btn = $('genBtn');
    const voice = $('voiceSel').value, text = $('text').value.trim(), model = $('modelSel').value;
    if (!voice) return msg($('genMsg'), '声を選んでください。', 'err');
    if (!text) return msg($('genMsg'), '文章を入力してください。', 'err');
    stopPreview();
    btn.disabled = true; msg($('genMsg'), '生成中…');
    try {
      const body = { text, model_id: model };
      if (model !== 'eleven_v3') {
        body.voice_settings = {
          stability: Number($('stab').value),
          similarity_boost: Number($('sim').value),
          speed: Number($('speed').value)
        };
      }
      const res = await api('/v1/text-to-speech/' + encodeURIComponent(voice) + '?output_format=mp3_44100_128', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const blob = await res.blob();
      const v = selectedVoice();
      current = { blob, name: 'voice_' + stamp() + '.mp3', label: (v ? v.name.split(' - ')[0] : '') + '：' + text.slice(0, 30) };
      history.unshift(current);
      renderHistory();
      const p = $('outPlayer');
      p.src = URL.createObjectURL(blob); p.hidden = false;
      $('outActions').hidden = false;
      $('shareBtn').hidden = !(navigator.canShare && navigator.canShare({ files: [toFile(current)] }));
      msg($('genMsg'), '生成しました。', 'ok');
      p.play().catch(() => {});
    } catch (e) { msg($('genMsg'), '生成できませんでした: ' + e.message, 'err'); }
    btn.disabled = false;
  };

  function download(item) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(item.blob); a.download = item.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  $('dlBtn').onclick = () => current && download(current);
  $('shareBtn').onclick = async () => { if (current) { try { await navigator.share({ files: [toFile(current)] }); } catch {} } };

  function renderHistory() {
    const box = $('history');
    box.innerHTML = '';
    history.forEach(item => {
      const row = document.createElement('div'); row.className = 'hist';
      const t = document.createElement('span'); t.textContent = item.label;
      const play = document.createElement('button'); play.className = 'ghost'; play.textContent = '▶';
      play.onclick = () => { const p = $('outPlayer'); p.src = URL.createObjectURL(item.blob); p.hidden = false; current = item; $('outActions').hidden = false; p.play().catch(() => {}); };
      const dl = document.createElement('button'); dl.className = 'ghost'; dl.textContent = '保存';
      dl.onclick = () => download(item);
      row.append(t, play, dl); box.appendChild(row);
    });
  }

  // ---------- init ----------
  $('apiKey').value = store.get('mv_key');
  if (key()) loadVoices().then(n => msg($('keyMsg'), '使える声: ' + n + ' 種類', 'ok')).catch(e => msg($('keyMsg'), e.message, 'err'));
})();
</script>
</body>
</html>
